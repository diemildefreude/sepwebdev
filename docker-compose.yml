services:
  web:
    build: .
    container_name: sepwebdev-web-1
    volumes:
      - ../showmetheworld/dist:/var/www/html/public/showmetheworld
      - ../showmetheworld/smtw-backend:/var/www/html/public/smtw-backend
    environment:
      - DB_HOST=db
      - DB_CONNECTION=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-sepwebdev}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - npm_default
      - default

  db:
    image: mysql:8.0
    container_name: sepwebdev-db-1
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE:-sepwebdev}
    volumes:
      - db_data:/var/lib/mysql
      - ./sepwebdev.sql:/docker-entrypoint-initdb.d/sepwebdev.sql
    networks:
      - default

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sepwebdev-phpmyadmin-1
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - npm_default
      - default

networks:
  npm_default:
    external: true

volumes:
  db_data:
